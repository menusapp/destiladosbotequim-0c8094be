# =====================================================================
# Configuração do projeto Supabase.
#
# project_id: troque pelo ref do SEU projeto (Supabase → Settings → General
# → Reference ID). `supabase link --project-ref <ref>` também preenche aqui.
# =====================================================================
project_id = "COLOQUE_AQUI_O_REF_DO_SEU_PROJETO"

# ---------------------------------------------------------------------
# verify_jwt das edge functions
# ---------------------------------------------------------------------
# ATENÇÃO — isto não é detalhe: o CLI do Supabase usa verify_jwt = true por
# padrão. Se estas linhas não existirem, o deploy sobe TODAS as functions
# exigindo um JWT do Supabase Auth e as integrações param de responder, com
# 401, sem erro visível no app.
#
# Este sistema NÃO usa Supabase Auth: a sessão de staff/CEO é um token opaco
# próprio, mandado no header `x-app-token` (ver src/integrations/supabase/
# client.ts, que inclusive remove o header Authorization quando a chave é do
# formato novo `sb_publishable_`). Ou seja: nenhuma chamada do app carrega
# JWT. Somado aos webhooks (iFood, Delivery Direto, Mercado Pago, WhatsApp) e
# aos cron jobs, todas as functions precisam de verify_jwt = false.
#
# ⚠️  Consequência, que já vale para o Lovable hoje: estes endpoints ficam
#     publicamente chamáveis. Funções sensíveis como `staff-create` e
#     `update-restaurant-credentials` não checam autorização por conta
#     própria. Ver a seção "Dívida de segurança" no MIGRACAO.md.
# ---------------------------------------------------------------------

# chamada por cron job
[functions.check-trial-expiry]
verify_jwt = false

